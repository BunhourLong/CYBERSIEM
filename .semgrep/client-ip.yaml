rules:
  - id: no-leftmost-forwarded-for
    languages: [python]
    severity: ERROR
    message: The client IP comes from request.client, which uvicorn resolves from FORWARDED_ALLOW_IPS. Never read X-Forwarded-For or take its leftmost value, because the client controls it (invariant 5).
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $REQ.headers.get($H, ...)
              - pattern: $REQ.headers.getlist($H)
          - metavariable-regex:
              metavariable: $H
              regex: (?i)^["']x-forwarded-for["']$
      - patterns:
          - pattern: $REQ.headers[$H]
          - metavariable-regex:
              metavariable: $H
              regex: (?i)^["']x-forwarded-for["']$
      - patterns:
          - pattern: $X.split(...)[0]
          - metavariable-regex:
              metavariable: $X
              regex: (?i).*(xff|forwarded).*
      - patterns:
          - pattern: $NAME[0]
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i).*(forwarded|xff).*
