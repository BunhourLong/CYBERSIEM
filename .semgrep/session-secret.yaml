rules:
  - id: no-default-session-secret
    languages: [python]
    severity: ERROR
    message: SESSION_SECRET must never have a default value. Read it with no fallback and refuse to start when it is missing or weak (see load_session_secret).
    pattern-either:
      - pattern: os.getenv("SESSION_SECRET", $D)
      - pattern: os.environ.get("SESSION_SECRET", $D)
      - patterns:
          - pattern-either:
              - pattern: os.getenv("SESSION_SECRET") or $D
              - pattern: os.environ.get("SESSION_SECRET") or $D
          # an empty fallback is rejected by the length check, so it is not a default
          - pattern-not: $X or ""
