services:
  postgres:
    image: postgres:16
    container_name: cybersiem_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cybersiem
      POSTGRES_USER: cybersiem
      POSTGRES_PASSWORD: cybersiem
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  nginx:
    image: nginx:1.27-alpine
    container_name: cybersiem_nginx
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
      - nginx_dynamic:/etc/nginx/dynamic
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /var/log/nginx /etc/nginx/dynamic
        rm -f /var/log/nginx/access.log /var/log/nginx/error.log
        touch /var/log/nginx/access.log /var/log/nginx/error.log
        if [ ! -f /etc/nginx/dynamic/blocklist.conf ]; then
          printf '# Managed by CyberSIEM. Do not edit manually.\n' > /etc/nginx/dynamic/blocklist.conf
        fi
        BLOCKLIST_CHECKSUM="$$(sha256sum /etc/nginx/dynamic/blocklist.conf | awk '{print $$1}')"
        (
          while true; do
            NEW_CHECKSUM="$$(sha256sum /etc/nginx/dynamic/blocklist.conf | awk '{print $$1}')"
            if [ "$$NEW_CHECKSUM" != "$$BLOCKLIST_CHECKSUM" ]; then
              BLOCKLIST_CHECKSUM="$$NEW_CHECKSUM"
              nginx -t && nginx -s reload || echo '[nginx] blocklist reload failed'
            fi
            sleep 2
          done
        ) &
        exec nginx -g 'daemon off;'

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: cybersiem_api
    environment:
      DATABASE_URL: postgresql://cybersiem:cybersiem@postgres:5432/cybersiem
      GEOIP_DB_PATH: /data/GeoLite2-City.mmdb
      GEOIP_ASN_DB_PATH: /data/GeoLite2-ASN.mmdb
      NGINX_BLOCKLIST_PATH: /shared-nginx/blocklist.conf
      REPUTATION_BLOCK_DURATION_SECONDS: "1800"
      REPUTATION_COOLDOWN_DURATION_SECONDS: "1800"
      REPUTATION_SUPPRESS_DURATION_SECONDS: "3600"
      REPUTATION_DECAY_PER_HOUR: "8"
      REPUTATION_REPEATED_MEDIUM_ALERT_COUNT: "3"
      SESSION_SECRET: ${SESSION_SECRET}
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "8000:8000"
    volumes:
      - ../data:/data:ro
      - nginx_dynamic:/shared-nginx
    depends_on:
      - postgres

  security_engine:
    build:
      context: ..
      dockerfile: docker/security_engine.Dockerfile
    container_name: cybersiem_security_engine
    environment:
      DATABASE_URL: postgresql://cybersiem:cybersiem@postgres:5432/cybersiem
      NGINX_ACCESS_LOG: /var/log/nginx/access.log
      NGINX_BLOCKLIST_PATH: /shared-nginx/blocklist.conf
      REPUTATION_BLOCK_DURATION_SECONDS: "1800"
      REPUTATION_COOLDOWN_DURATION_SECONDS: "1800"
      REPUTATION_SUPPRESS_DURATION_SECONDS: "3600"
      REPUTATION_DECAY_PER_HOUR: "8"
      REPUTATION_REPEATED_MEDIUM_ALERT_COUNT: "3"
    volumes:
      - nginx_logs:/var/log/nginx
      - nginx_dynamic:/shared-nginx
    depends_on:
      - postgres
      - nginx

volumes:
  postgres_data:
  nginx_logs:
  nginx_dynamic:
