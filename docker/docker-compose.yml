version: "3.9"

services:
  mongodb:
    image: mongo:latest
    container_name: sentinel_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: sentinel
      MONGO_INITDB_ROOT_PASSWORD: sentinelpass
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
