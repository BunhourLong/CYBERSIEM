worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # This nginx is the edge proxy: the client IP is the TCP peer.

    log_format cybersiem_combined '$remote_addr - $remote_user [$time_local] '
                                  '"$request" $status $body_bytes_sent '
                                  '"$http_referer" "$http_user_agent" '
                                  '"$http_x_forwarded_for" "$http_x_real_ip" "$realip_remote_addr"';

    access_log /var/log/nginx/access.log cybersiem_combined;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;
        include /etc/nginx/dynamic/blocklist.conf;

        location = /health {
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location / {
            add_header Content-Type text/plain;
            return 200 'CyberSIEM nginx';
        }
    }
}
