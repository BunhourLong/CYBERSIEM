worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Trust forwarded client IPs only from local/private proxy hops.
    # Replace these ranges with your exact load balancer or reverse proxy CIDRs in production.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    log_format cybersiem_combined '$remote_addr - $remote_user [$time_local] '
                                  '"$request" $status $body_bytes_sent '
                                  '"$http_referer" "$http_user_agent" '
                                  '"$http_x_forwarded_for" "$http_x_real_ip" "$realip_remote_addr"';

    access_log /var/log/nginx/access.log cybersiem_combined;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;
        include /etc/nginx/dynamic/blocklist.conf;

        location = /health {
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location / {
            add_header Content-Type text/plain;
            return 200 'CyberSIEM nginx';
        }
    }
}
