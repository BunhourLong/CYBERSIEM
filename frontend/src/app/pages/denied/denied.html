<app-header subtitle="Access control" [minimal]="true" />

<main class="container denied">
  <section class="denied__card">
    <div class="denied__icon" aria-hidden="true">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"
        />
      </svg>
    </div>

    <h2 class="denied__title">Access Denied</h2>
    <p class="denied__text">
      Your account role <span class="denied__code">({{ session.user()?.role }})</span> does not have permission to
      access this resource.
    </p>
    @if (required(); as role) {
      <p class="denied__required">
        Required role: <span class="denied__code denied__code--muted">{{ role }}</span> or above.
      </p>
    }

    <a routerLink="/dashboard" class="btn btn--primary denied__back">Return to Dashboard</a>
  </section>
</main>
