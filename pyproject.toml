[project]
name = "cybersiem"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "scapy>=2.5.0",
    "pymongo>=4.6.0",
    "streamlit>=1.32.0",
    "plotly>=5.20.0",
    "geoip2>=4.8.0",
    "python-nmap>=0.7.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "psycopg[binary]>=3.3.7",
    "pydantic>=2.8.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff==0.17.3", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
# The formatter owns line length; it can't split long strings.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Asserts and dummy credentials are what tests are made of.
"tests/**" = ["S101", "S105", "S106"]
