<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cappa Alerts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-[#0f0f0f] text-[#f5f5f5] antialiased">
    <div class="min-h-screen [font-family:'IBM_Plex_Sans','Helvetica_Neue','Noto_Sans',sans-serif]">
        <header class="border-b border-white/10 bg-[#0f0f0f]">
            <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-6 py-4">
                <div>
                    <h1 class="text-lg font-semibold tracking-tight">Cappa</h1>
                    <p class="mt-1 text-sm text-zinc-400">Alert operations</p>
                </div>
                <nav class="flex items-center gap-2 text-sm">
                    <a
                        href="/dashboard"
                        class="rounded-md border border-zinc-700 px-3 py-2 text-zinc-300 transition-colors duration-150 hover:bg-zinc-800"
                    >
                        Dashboard
                    </a>
                    <a
                        href="/alerts"
                        class="rounded-md border border-zinc-600 bg-zinc-800 px-3 py-2 text-zinc-100"
                    >
                        Alerts
                    </a>
                    <div class="flex items-center gap-2 pl-2 border-l border-zinc-700/60">
                        <span class="font-mono text-xs text-zinc-400">{{ current_user.username }}</span>
                        <span class="rounded px-1.5 py-0.5 text-xs font-medium
                            {% if current_user.role == 'admin' %}bg-red-900/40 text-red-400
                            {% elif current_user.role == 'analyst' %}bg-blue-900/40 text-blue-400
                            {% else %}bg-zinc-800 text-zinc-500{% endif %}">
                            {{ current_user.role }}
                        </span>
                        <form method="post" action="/logout">
                            <button type="submit" class="rounded-md border border-zinc-700 px-3 py-2 text-zinc-400 transition-colors duration-150 hover:bg-zinc-800 hover:text-zinc-200">
                                Sign out
                            </button>
                        </form>
                    </div>
                </nav>
            </div>
        </header>

        <main class="mx-auto max-w-7xl px-6 py-6">
            <section class="rounded-md border border-white/10 bg-[#1a1a1a]">
                <div class="flex items-center justify-between gap-4 border-b border-white/10 px-4 py-4">
                    <h2 class="text-base font-semibold text-zinc-100">Alerts</h2>
                    <p class="text-sm text-zinc-400">
                        {{ blocked_ips|length }} blocked IPs - Live table refreshes every 5 seconds
                    </p>
                </div>
                {% include "alerts_table.html" %}
            </section>
        </main>
    </div>

    <script>
        const EXPANDED_ALERTS_STORAGE_KEY = "cybersiem-expanded-alerts";

        function loadExpandedAlertRows() {
            try {
                const stored = JSON.parse(localStorage.getItem(EXPANDED_ALERTS_STORAGE_KEY) || "[]");
                return new Set(stored.map(String));
            } catch (error) {
                return new Set();
            }
        }

        function persistExpandedAlertRows() {
            try {
                localStorage.setItem(
                    EXPANDED_ALERTS_STORAGE_KEY,
                    JSON.stringify(Array.from(window.expandedAlertRows))
                );
            } catch (error) {
                return;
            }
        }

        window.expandedAlertRows = loadExpandedAlertRows();

        function applyAlertRowState(alertId, expanded) {
            const row = document.getElementById(`alert-row-${alertId}`);
            const details = document.getElementById(`alert-details-${alertId}`);
            const indicator = document.getElementById(`alert-indicator-${alertId}`);

            if (!row || !details || !indicator) {
                return;
            }

            details.classList.toggle("hidden", !expanded);
            row.setAttribute("aria-expanded", expanded ? "true" : "false");
            row.dataset.expanded = expanded ? "true" : "false";
            indicator.textContent = expanded ? "-" : "+";
        }

        function restoreExpandedRows() {
            const visibleAlertIds = new Set();

            document.querySelectorAll("#alerts-table [data-alert-id]").forEach((row) => {
                const alertId = row.getAttribute("data-alert-id");
                visibleAlertIds.add(alertId);
                applyAlertRowState(alertId, window.expandedAlertRows.has(alertId));
            });

            Array.from(window.expandedAlertRows).forEach((alertId) => {
                if (!visibleAlertIds.has(alertId)) {
                    window.expandedAlertRows.delete(alertId);
                }
            });

            persistExpandedAlertRows();
        }

        function toggleDetails(alertId, event) {
            if (event && event.target.closest("button, a, form, input, select, textarea, label")) {
                return;
            }

            const key = String(alertId);
            if (window.expandedAlertRows.has(key)) {
                window.expandedAlertRows.delete(key);
            } else {
                window.expandedAlertRows.add(key);
            }

            persistExpandedAlertRows();
            applyAlertRowState(key, window.expandedAlertRows.has(key));
        }

        document.addEventListener("DOMContentLoaded", restoreExpandedRows);
        document.body.addEventListener("htmx:afterSwap", (event) => {
            if (event.target.id !== "alerts-table") {
                return;
            }

            restoreExpandedRows();
        });
    </script>
</body>
</html>
