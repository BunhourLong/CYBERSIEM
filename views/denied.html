<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CyberSIEM — Access Denied</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f0f0f] text-[#f5f5f5] antialiased">
    <div class="min-h-screen [font-family:'IBM_Plex_Sans','Helvetica_Neue','Noto_Sans',sans-serif]">
        <header class="border-b border-white/10 bg-[#0f0f0f]">
            <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-6 py-4">
                <div>
                    <h1 class="text-lg font-semibold tracking-tight">CyberSIEM</h1>
                    <p class="mt-1 text-sm text-zinc-400">Access control</p>
                </div>
                <nav class="flex items-center gap-2 text-sm">
                    <a href="/dashboard" class="rounded-md border border-zinc-700 px-3 py-2 text-zinc-300 transition-colors duration-150 hover:bg-zinc-800">Dashboard</a>
                    <form method="post" action="/logout">
                        <button type="submit" class="rounded-md border border-zinc-700 px-3 py-2 text-zinc-400 transition-colors duration-150 hover:bg-zinc-800 hover:text-zinc-200">
                            Sign out
                        </button>
                    </form>
                </nav>
            </div>
        </header>

        <main class="mx-auto max-w-7xl px-6 py-16">
            <div class="mx-auto max-w-md rounded-md border border-red-900/50 bg-[#1a1a1a] p-8 text-center">
                <div class="mb-4 inline-flex h-12 w-12 items-center justify-center rounded-full border border-red-800/50 bg-red-950/30">
                    <svg class="h-6 w-6 text-red-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                    </svg>
                </div>
                <h2 class="mb-2 text-lg font-semibold text-zinc-100">Access Denied</h2>
                <p class="mb-1 text-sm text-zinc-400">
                    Your account role <span class="font-mono text-zinc-300">({{ role }})</span> does not have permission to access this resource.
                </p>
                {% if required %}
                <p class="mb-6 text-sm text-zinc-500">
                    Required role: <span class="font-mono text-zinc-400">{{ required }}</span> or above.
                </p>
                {% else %}
                <p class="mb-6"></p>
                {% endif %}
                <a href="/dashboard" class="inline-block rounded border border-zinc-600 bg-zinc-800 px-4 py-2 text-sm font-medium text-zinc-100 transition-colors duration-150 hover:bg-zinc-700">
                    Return to Dashboard
                </a>
            </div>
        </main>
    </div>
</body>
</html>
