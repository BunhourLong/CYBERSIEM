<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cappa Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f0f0f] text-[#f5f5f5] antialiased">
    <div class="min-h-screen flex items-center justify-center [font-family:'IBM_Plex_Sans','Helvetica_Neue','Noto_Sans',sans-serif]">
        <div class="w-full max-w-sm">
            <div class="mb-8 text-center">
                <h1 class="text-xl font-semibold tracking-tight">Cappa</h1>
                <p class="mt-1 text-sm text-zinc-400">Sign in to continue</p>
            </div>

            <div class="rounded-md border border-white/10 bg-[#1a1a1a] p-6">
                {% if error %}
                <div class="mb-4 rounded border border-red-800 bg-red-950/50 px-3 py-2 text-sm text-red-400">
                    {{ error }}
                </div>
                {% endif %}

                <form method="post" action="/login" class="space-y-4">
                    <div>
                        <label for="username" class="block text-xs font-medium text-zinc-400 mb-1">Username</label>
                        <input
                            id="username"
                            name="username"
                            type="text"
                            autocomplete="username"
                            required
                            class="w-full rounded border border-zinc-700 bg-zinc-900 px-3 py-2 text-sm text-zinc-100 placeholder-zinc-600 outline-none focus:border-zinc-500 focus:ring-0"
                        >
                    </div>
                    <div>
                        <label for="password" class="block text-xs font-medium text-zinc-400 mb-1">Password</label>
                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                            class="w-full rounded border border-zinc-700 bg-zinc-900 px-3 py-2 text-sm text-zinc-100 placeholder-zinc-600 outline-none focus:border-zinc-500 focus:ring-0"
                        >
                    </div>
                    <button
                        type="submit"
                        class="w-full rounded border border-zinc-600 bg-zinc-800 px-3 py-2 text-sm font-medium text-zinc-100 transition-colors duration-150 hover:bg-zinc-700"
                    >
                        Sign in
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
